name: Apply PD label cleanup

on:
  push:
    branches:
      - agent/remove-pd-label-redundancy-10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update workflow label
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/ui/inspector/InspectorSelectionController.tsx')
          old = "      label: `${limitCycleFromPDLabel} from period doubling`,"
          new = "      label: limitCycleFromPDLabel,"
          text = path.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one matching label; found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'No change produced.'; exit 1; } || true

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/ui/inspector/InspectorSelectionController.tsx
          git commit -m "fix: remove redundant period-doubling label"
          git push origin HEAD:main

      - name: Remove temporary branches
        if: always()
        shell: bash
        run: |
          for branch in \
            agent/remove-pd-label-redundancy \
            agent/remove-pd-label-redundancy-2 \
            agent/remove-pd-label-redundancy-3 \
            agent/remove-pd-label-redundancy-4 \
            agent/remove-pd-label-redundancy-5 \
            agent/remove-pd-label-redundancy-6 \
            agent/remove-pd-label-redundancy-7 \
            agent/remove-pd-label-redundancy-8 \
            agent/remove-pd-label-redundancy-9 \
            agent/remove-pd-label-redundancy-10
          do
            git push origin --delete "$branch" 2>/dev/null || true
          done
